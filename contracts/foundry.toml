[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# OpenZeppelin is installed by pnpm at the workspace root and reached through a
# junction at lib/openzeppelin-contracts, created by `pnpm setup:lib`. Inside
# the project root rather than via allow_paths, because `forge coverage`
# resolves relative imports differently and cannot follow a path that escapes
# it — a workspace where the tests pass but coverage will not run is a
# workspace where coverage stops being measured.

# Read-only, and scoped to the one directory the differential fixtures live in.
# Granting the project root would let a test read anything on the machine.
fs_permissions = [{access = "read", path = "./test/fixtures"}]

solc_version = "0.8.28"
evm_version = "cancun"

# Optimised for deployment cost rather than call cost. These contracts are
# deployed once per protocol (and once per borrower for the router), then
# called continuously — but the router is the only hot path, and its
# distribution is a handful of transfers.
optimizer = true
optimizer_runs = 200

# Fail the build on anything that could hide a mistake in a contract holding
# other people's money.
deny = "warnings"

# Deterministic fuzzing, so a failure found in CI reproduces locally. The
# waterfall and vault invariants are worth a deep run.
[fuzz]
runs = 512
seed = "0x1337"

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"
